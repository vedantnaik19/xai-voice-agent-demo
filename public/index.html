<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Agent</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      height: 100%;
      margin: 0;
      background: #0a0a0a;
      color: #f0f0f0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
    }
    .view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100%;
      width: 100%;
    }
    .view[hidden] { display: none; }
    #talkBtn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: #3366ff;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    #talkBtn:active { transform: scale(0.97); }
    #talkBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #talkBtn.active { background: #cc3333; }
    #statusText { font-size: 0.9rem; color: #999; }
    #codeView h1 { font-size: 1.3rem; font-weight: 600; margin: 0; }
    #codeView p { font-size: 0.9rem; color: #999; margin: 0 0 8px; }
    #gate { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #gate input {
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #f0f0f0;
      text-align: center;
      width: 200px;
    }
    #gate button {
      padding: 10px 20px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: none;
      background: #3366ff;
      color: #fff;
      cursor: pointer;
    }
    #gate button:disabled { opacity: 0.5; cursor: not-allowed; }
    #gateError { font-size: 0.85rem; color: #ff6b6b; min-height: 1em; }
  </style>
</head>
<body>
  <div id="codeView" class="view">
    <h1>Voice Agent</h1>
    <p>Enter access code to continue</p>
    <form id="gate">
      <input id="codeInput" type="password" placeholder="Access code" autocomplete="off" autofocus />
      <button type="submit">Continue</button>
      <div id="gateError"></div>
    </form>
  </div>

  <div id="talkView" class="view" hidden>
    <button id="talkBtn">Start</button>
    <div id="statusText">disconnected</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
