<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Agent</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background: #ffffff;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    #status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: #eee;
      color: #333;
    }
    #status.connected { background: #d4f7d4; color: #1a6b1a; }
    #status.connecting { background: #fff3cd; color: #8a6d00; }
    #status.error { background: #f8d4d4; color: #8a1a1a; }
    .controls { display: flex; gap: 8px; margin: 16px 0; }
    button {
      padding: 10px 16px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: #f5f5f5;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.active { background: #d4e4ff; border-color: #6699ff; }
    #transcript {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    #transcript .user { color: #1a4b8a; }
    #transcript .agent { color: #1a6b1a; }
    .text-row { display: flex; gap: 8px; margin-top: 12px; }
    .text-row input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Voice Agent <span id="status">disconnected</span></h1>

  <div class="controls">
    <button id="connectBtn">Connect</button>
    <button id="micBtn" disabled>🎙️ Start mic</button>
  </div>

  <div id="transcript"></div>

  <form class="text-row" id="textForm">
    <input id="textInput" type="text" placeholder="Or type a message..." disabled />
    <button id="sendBtn" type="submit" disabled>Send</button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
